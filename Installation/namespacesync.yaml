#ROOT_SOURCE/namespaces/NAMESPACE/repo-sync.yaml
apiVersion: configsync.gke.io/v1beta1
kind: RepoSync
metadata:
  name: nssync
  namespace: config-management-system
spec:
  sourceType: git
  # Since this is for a namespace repository, the format is unstructured
  sourceFormat: unstructured
  git:
    repo: https://github.com/vivekkontham/namespacerepo.git
    branch: main
    dir: "namespaceconfig/applications/namespace/deployment/overlay-dso"
    auth: token
    secretRef:
      name: git-creds